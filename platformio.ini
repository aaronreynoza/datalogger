; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:t-beams3-supreme]
platform = espressif32
board = t-beams3-supreme
framework = arduino
build_flags = -DBOARD_HAS_PSRAM
monitor_port = /dev/cu.usbmodem1101
monitor_speed = 115200
; Uncomment to log only sensor status (no GPS/IMU telemetry logs)
; build_flags = -DLOG_STATUS_ONLY
; GNSS debug (prints bytes/second)
; build_flags = -DGNSS_DEBUG
; build_flags = -DGNSS_DEBUG -DGNSS_DEBUG_NMEA
lib_deps =
	TinyGPSPlus
	lewisxhe/SensorLib
	lewisxhe/XPowersLib
	olikraus/U8g2
	jgromes/RadioLib
	bblanchon/ArduinoJson
	mathieucarbou/ESPAsyncWebServer

[env:native]
platform = native
build_flags = -std=c++17
test_framework = unity
lib_deps =
lib_ignore = TinyGPSPlus, SensorLib, XPowersLib, U8g2, RadioLib, ArduinoJson
